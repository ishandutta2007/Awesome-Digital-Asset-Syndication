<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-node{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}@keyframes flow-line{0%{stroke-dashoffset:40}}@keyframes float-bg{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.subtitle,.tag,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.tag{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}.animated-node{animation:pulse-node 3s infinite ease-in-out;transform-box:fill-box;transform-origin:center}.node-2{animation-delay:1s}.node-3{animation-delay:2s}.animated-flow{stroke-dasharray:8 8;animation:flow-line 2s linear infinite}.floating-card{animation:float-bg 5s infinite ease-in-out}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="150" cy="80" r="180" fill="#6366f1" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="280" r="160" fill="#ec4899" filter="url(#glow)" opacity=".12"/><g><path stroke="url(#cyan-glow)" stroke-opacity=".4" stroke-width="2" d="M 50 140 L 170 80 M 50 140 L 170 200 M 170 80 L 290 140 M 170 200 L 290 140" transform="translate(750, 40)"/><path stroke="#38bdf8" stroke-width="2" d="M 50 140 L 170 80 M 50 140 L 170 200 M 170 80 L 290 140 M 170 200 L 290 140" class="animated-flow" opacity=".8" transform="translate(750, 40)"/><g class="floating-card" transform="translate(750, 40)"><rect width="100" height="60" x="0" y="110" fill="#1e293b" stroke="#6366f1" stroke-width="2" rx="10"/><text x="50" y="145" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PIM / DAM</text></g><g class="animated-node node-1" transform="translate(750, 40)"><circle cx="170" cy="80" r="28" fill="#0f172a" stroke="#a855f7" stroke-width="3" filter="url(#glow)"/><text x="170" y="85" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ETL</text></g><g class="animated-node node-2" transform="translate(750, 40)"><circle cx="170" cy="200" r="28" fill="#0f172a" stroke="#06b6d4" stroke-width="3" filter="url(#glow)"/><text x="170" y="205" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FEED</text></g><g class="animated-node node-3" transform="translate(750, 40) translate(260, 110)"><rect width="110" height="60" x="0" y="0" fill="#1e293b" stroke="#ec4899" stroke-width="2" rx="10"/><text x="55" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Channels</text><text x="55" y="45" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">API / Marketplaces</text></g></g><g><g transform="translate(80, 0) translate(0, 65)"><rect width="280" height="30" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="15"/><text x="140" y="20" class="tag" text-anchor="middle">🚀 Digital Asset &amp; Catalog</text></g><text x="0" y="145" class="title" transform="translate(80, 0)">Awesome Digital Asset</text><text x="0" y="200" fill="url(#primary-glow)" class="title" transform="translate(80, 0)">Syndication 🌐</text><text x="0" y="250" class="subtitle" transform="translate(80, 0)">Top Product Feed Management, PIM, &amp; Marketplace Tools</text><text x="0" y="280" fill="#64748b" class="subtitle" font-size="16" transform="translate(80, 0)">Curated SaaS Platforms &amp; Open-Source Ecosystem Guide</text></g><rect width="1200" height="8" x="0" y="352" fill="url(#primary-glow)"/></svg>