<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    
    /* Dynamic Floating Elements */
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes flow-line {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-bg {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .animated-node { animation: pulse-node 3s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
    .node-2 { animation-delay: 1s; }
    .node-3 { animation-delay: 2s; }
    .animated-flow { stroke-dasharray: 8 8; animation: flow-line 2s linear infinite; }
    .floating-card { animation: float-bg 5s infinite ease-in-out; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Background Dynamic Network Graphic (Positioned safely on the right side) -->
  <g transform="translate(750, 40)">
    <!-- Dynamic Connecting Flows -->
    <path d="M 50 140 L 170 80 M 50 140 L 170 200 M 170 80 L 290 140 M 170 200 L 290 140" stroke="url(#cyan-glow)" stroke-width="2" stroke-opacity="0.4" />
    <path d="M 50 140 L 170 80 M 50 140 L 170 200 M 170 80 L 290 140 M 170 200 L 290 140" stroke="#38bdf8" stroke-width="2" class="animated-flow" opacity="0.8" />

    <!-- Network Nodes -->
    <!-- Source PIM Node -->
    <g class="floating-card">
      <rect x="0" y="110" width="100" height="60" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
      <text x="50" y="145" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">PIM / DAM</text>
    </g>

    <!-- Syndication / ETL Engine Center Node -->
    <g class="animated-node node-1">
      <circle cx="170" cy="80" r="28" fill="#0f172a" stroke="#a855f7" stroke-width="3" filter="url(#glow)" />
      <text x="170" y="85" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="bold">ETL</text>
    </g>

    <g class="animated-node node-2">
      <circle cx="170" cy="200" r="28" fill="#0f172a" stroke="#06b6d4" stroke-width="3" filter="url(#glow)" />
      <text x="170" y="205" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="bold">FEED</text>
    </g>

    <!-- Channels Destination Nodes -->
    <g class="animated-node node-3" transform="translate(260, 110)">
      <rect x="0" y="0" width="110" height="60" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
      <text x="55" y="25" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Channels</text>
      <text x="55" y="45" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">API / Marketplaces</text>
    </g>
  </g>

  <!-- Left Side Foreground Header (Title & Subtitle positioned cleanly away from dynamic animations) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 65)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="140" y="20" text-anchor="middle" class="tag">🚀 Digital Asset &amp; Catalog</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Digital Asset</text>
    <text x="0" y="200" class="title" fill="url(#primary-glow)">Syndication 🌐</text>

    <!-- Subtitle -->
    <text x="0" y="250" class="subtitle">Top Product Feed Management, PIM, &amp; Marketplace Tools</text>
    <text x="0" y="280" class="subtitle" font-size="16" fill="#64748b">Curated SaaS Platforms &amp; Open-Source Ecosystem Guide</text>
  </g>

  <!-- Decorative Bottom Border Bar -->
  <rect x="0" y="352" width="1200" height="8" fill="url(#primary-glow)" />
</svg>
